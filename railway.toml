# Railway deployment config for Frappe LMS
# Docs: https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "/home/frappe/railway-entrypoint.sh"
# No healthcheckPath — first boot takes 3-5 min (site creation + app install + bench start).
# Railway will use TCP socket detection instead. The container becomes "healthy" once
# something binds to $PORT.
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
